name: Windows executable and installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build native Qt EXE + portable Python + installer
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python 3.12 for tests and wheel staging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements-advanced.txt

      - name: Install Qt 6 MSVC (dynamic DLLs)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Python regression suite
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements-advanced.txt
          if ($LASTEXITCODE -ne 0) { throw 'Analysis dependency installation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed' }

      - name: Configure Qt desktop build
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build PytroNOVA.exe (Release)
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Qt C++ build failed' }

      - name: Bundle Qt, isolated Python, NumPy, SciPy and TXT converter
        shell: pwsh
        run: .\scripts\package_windows.ps1 -BuildDir build/windows -QtDir "$env:QT_ROOT_DIR"

      - name: Compile per-user Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install Inno Setup' }
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is unavailable' }
          & $iscc 'packaging\windows\PytroNOVA.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }

      - name: Check build outputs and checksums
        shell: pwsh
        run: |
          $names = @(
            'dist/Pytro-NOVA-v3.9.4-Windows-x64.zip',
            'dist/Pytro-NOVA-Setup-v3.9.4-Windows-x64.exe'
          )
          foreach ($file in $names) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            Get-FileHash -Algorithm SHA256 $file | Format-List
          }

      - name: Upload portable Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Pytro-NOVA-Windows-Portable
          path: dist/Pytro-NOVA-v3.9.4-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows installer executable
        uses: actions/upload-artifact@v4
        with:
          name: Pytro-NOVA-Windows-Installer
          path: dist/Pytro-NOVA-Setup-v3.9.4-Windows-x64.exe
          if-no-files-found: error

  publish-windows-release:
    if: github.event_name == 'release'
    needs: windows-x64
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download built Windows assets
        uses: actions/download-artifact@v4
        with:
          pattern: Pytro-NOVA-Windows-*
          merge-multiple: true
          path: dist
      - name: Publish EXE and ZIP with GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            'dist/Pytro-NOVA-v3.9.4-Windows-x64.zip' `
            'dist/Pytro-NOVA-Setup-v3.9.4-Windows-x64.exe' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed' }
