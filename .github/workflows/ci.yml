name: Linux build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake \
            qt6-base-dev python3-numpy python3-scipy
      - name: Python regression suite
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Configure native Qt build
        run: cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Compile Qt application
        run: cmake --build build/linux --parallel 2
      - name: Qt startup smoke check
        run: QT_QPA_PLATFORM=offscreen build/linux/PytroNOVA --verify-runtime
      - name: Create Debian installer
        run: (cd build/linux && cpack -G DEB)
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: pytro-nova-ubuntu-deb
          path: build/linux/*.deb

  publish-linux-release:
    if: github.event_name == 'release'
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pytro-nova-ubuntu-deb
          path: dist
      - name: Publish Ubuntu 24.04 Debian installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.deb --clobber
